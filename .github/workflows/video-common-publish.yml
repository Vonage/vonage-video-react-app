name: video-common publish

on:
  push:
    branches:
      - develop
    paths:
      - 'libs/common/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - 'LICENSE'
      - 'scripts/commonPackage/**'
      - '.github/workflows/video-common-publish.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: Package tag (beta creates a prerelease; latest publishes the stable version)
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read

env:
  PUBLISH_CHANNEL: ${{ inputs.channel }}

jobs:
  build:
    if: >-
      github.repository == 'Vonage/vonage-video-react-app' &&
      github.ref_type == 'branch' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.package.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.11.2

      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Verify hash, test, build and pack
        id: package
        run: |
          node --test scripts/commonPackage/publishTarball.test.cjs
          npx tsx scripts/commonPackage/publish.ts pack "$RUNNER_TEMP/common-package"
          echo "channel=$(node -p "require(process.argv[1]).channel" "$RUNNER_TEMP/common-package/metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: common-package
          path: ${{ runner.temp }}/common-package
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.repository == 'Vonage/vonage-video-react-app' &&
      github.ref_type == 'branch' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    concurrency:
      group: video-common-publish-${{ needs.build.outputs.channel }}
      cancel-in-progress: false
    environment: npm-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout publish script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .nvmrc
            libs/common/manifest.json
            scripts/commonPackage/publishTarball.cjs

      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: common-package
          path: ${{ runner.temp }}/common-package

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/commonPackage/publishTarball.cjs "$RUNNER_TEMP/common-package"
