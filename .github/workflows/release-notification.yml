name: Notify Slack on Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-release:
    runs-on: ubuntu-24.04
    name: Notify Release
    steps:
      - name: Build Slack payload
        id: payload
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          jq -n \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            '{
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: (":tada: Version " + $name + " of the Vonage Native React Video Reference App Just Released!")
                  }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $body }
                },
                { type: "divider" },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("You can view the full change log <" + $url + "|here>")
                  }
                }
              ]
            }' > "${RUNNER_TEMP}/slack-payload.json"
          echo "path=${RUNNER_TEMP}/slack-payload.json" >> "$GITHUB_OUTPUT"

      - name: Send to slack channels
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload-file-path: ${{ steps.payload.outputs.path }}
