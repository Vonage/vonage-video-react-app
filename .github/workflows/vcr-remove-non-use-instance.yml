name: Remove PR VCR instance on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  remove-vcr:
    name: Remove VCR instance (merge trigger)
    if: github.event.pull_request.merged == true
    runs-on: [vcp-runner]

    steps:
      - name: Install VCR CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto =https --max-redirs 0 -fsSL https://raw.githubusercontent.com/Vonage/cloud-runtime-cli/main/script/install.sh -o install.sh
          sudo bash install.sh
          vcr -v

      - name: Remove VCR instance (tolerant)
        id: remove
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_NAME="vonage-video-react-app"
          INSTANCE_NAME="vera-pr-${{ github.event.pull_request.number }}"

          echo "instance_name=$INSTANCE_NAME" >> "$GITHUB_OUTPUT"

          set +e
          vcr instance remove \
            --project-name "$PROJECT_NAME" \
            --instance-name "$INSTANCE_NAME" \
            --api-key "${{ secrets.VCR_API_KEY }}" \
            --api-secret "${{ secrets.VCR_API_SECRET }}" \
            --region aws.euw1 \
            --graphql-endpoint https://graphql.euw1.runtime.vonage.cloud/v1/graphql \
            2>&1 | tee remove-vcr-logs.log
          RC=${PIPESTATUS[0]}
          set -e

          # Removed successfully
          if [ "$RC" -eq 0 ]; then
            echo "result=removed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Instance did not exist -> non-fatal
          if grep -Eqi 'not found|does not exist|no such|404' remove-vcr-logs.log; then
            echo "result=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Real failure
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Comment on PR (removed)
        if: steps.remove.outputs.result == 'removed'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const instanceName = `${{ steps.remove.outputs.instance_name }}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `✅ \`${instanceName}\` was removed`
            });

      - name: Comment on PR (no instance found)
        if: steps.remove.outputs.result == 'missing'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const instanceName = `${{ steps.remove.outputs.instance_name }}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `ℹ️ No instances was found for \`${instanceName}\``
            });

      - name: Comment on PR (failed)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const instanceName = `${{ steps.remove.outputs.instance_name }}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `❌ Failed to remove \`${instanceName}\`. Logs: ${runUrl}`
            });
