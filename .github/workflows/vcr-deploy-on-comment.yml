name: Deploy PR to VCR on comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

env:
  DOMAIN: ${{ secrets.DOMAIN }}

jobs:
  build-and-test:
    name: Deploy to VCR (comment trigger)
    # Run only when:
    # - comment is on a PR
    # - comment body is exactly 'vcr:deploy'
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == 'vcr:deploy'
    runs-on: [vcp-runner]
    steps:
      - name: Load PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title || '');
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput(
              'is_fork',
              String(pr.head.repo.full_name !== pr.base.repo.full_name)
            );

      - name: Block forks
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "Deployment from forked repositories is not allowed."
          exit 1

      - name: Checkout PR HEAD SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify Node & Yarn versions
        run: |
          node -v
          yarn -v

      # Create dev VCR config, patch instance name, build artefact
      - name: Building artefact
        run: |
          cp "${{ github.workspace }}/vcr-dev.example.yml" "${{ github.workspace }}/vcr-dev.yml"

          sed -i \
            "s/^  name: .*/  name: vera-pr-${{ steps.pr.outputs.number }}/" \
            "${{ github.workspace }}/vcr-dev.yml"

          ./vcrBuild.dev.sh

      - name: Install VCR CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto =https --max-redirs 0 -fsSL https://raw.githubusercontent.com/Vonage/cloud-runtime-cli/main/script/install.sh -o install.sh
          sudo bash install.sh
          vcr -v

      - name: Deploy vcr
        id: deploy
        run: |
          cd backend/dist

          vcr deploy --filename vcr-dev.yml \
            --app-id ${{ secrets.APP_ID }} \
            --api-key ${{ secrets.VCR_API_KEY }} \
            --api-secret ${{ secrets.VCR_API_SECRET }} \
            --region aws.euw1 \
            --graphql-endpoint https://graphql.euw1.runtime.vonage.cloud/v1/graphql \
            --timeout=15m 2>&1 | tee deploy-vcr-logs.log

          if ! grep -Fxq '| Instance has been deployed!' deploy-vcr-logs.log ; then
            echo "Deployment failed"
            exit 1
          fi

          INSTANCE_URL=$(grep -oE 'https://[^ ]+' deploy-vcr-logs.log | tail -1)

          if [ -z "$INSTANCE_URL" ]; then
            echo "Failed to extract instance URL"
            exit 1
          fi

          echo "instance_url=$INSTANCE_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on PR on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const { owner, repo } = context.repo;

            const prId = `${{ steps.pr.outputs.number }}`;
            const sha = `${{ steps.pr.outputs.head_sha }}`;
            const instanceUrl = `${{ steps.deploy.outputs.instance_url }}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                "🚀 **VCR deploy succeeded**",
                "",
                `- PR: #${prId}`,
                `- Commit: \`${sha}\``,
                `- Instance: \`vera-pr-${prId}\``,
                `- URL: ${instanceUrl}`,
                `- Logs: ${runUrl}`
              ].join("\n")
            });

      - name: Comment on PR on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const { owner, repo } = context.repo;

            const prId = `${{ steps.pr.outputs.number }}`;
            const sha = `${{ steps.pr.outputs.head_sha }}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                "❌ **VCR deploy failed**",
                "",
                `- PR: #${prId}`,
                `- Commit: \`${sha}\``,
                `- Instance: \`vera-pr-${prId}\``,
                `- Logs: ${runUrl}`
              ].join("\n")
            });
