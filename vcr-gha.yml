project:
  name: vonage-video-react-app
instance:
  name: dev
  runtime: nodejs22
  region: aws.euw1
  entrypoint: [node, bundle.cjs]
  # The placeholder <DOMAIN> will be replaced by sed in .github/workflows/deploy-to-vcr.yml
  domains: <DOMAIN>
  environment:
    - name: VIDEO_SERVICE_PROVIDER
      secret: VIDEO_SERVICE_PROVIDER
    - name: VONAGE_APP_ID
      secret: VONAGE_APP_ID
    - name: VONAGE_PRIVATE_KEY
      secret: VONAGE_PRIVATE_KEY
    - name: OT_API_KEY
      secret: OT_API_KEY
    # pragma: allowlist secret
    - name: OT_API_SECRET
      # pragma: allowlist secret
      secret: OT_API_SECRET
    - name: ENABLE_REPORT_ISSUE
      secret: ENABLE_REPORT_ISSUE
    - name: JIRA_URL
      secret: JIRA_URL
    - name: JIRA_API_URL
      secret: JIRA_API_URL
    - name: JIRA_TOKEN
      secret: JIRA_TOKEN
    - name: JIRA_PROJECT_KEY
      secret: JIRA_PROJECT_KEY
    - name: JIRA_COMPONENT_ID
      secret: JIRA_COMPONENT_ID
    - name: JIRA_iOS_COMPONENT_ID
      secret: JIRA_iOS_COMPONENT_ID
    - name: JIRA_ANDROID_COMPONENT_ID
      secret: JIRA_ANDROID_COMPONENT_ID
    - name: JIRA_EPIC_LINK
      secret: JIRA_EPIC_LINK
    - name: JIRA_EPIC_URL
      secret: JIRA_EPIC_URL
    - name: JIRA_SEVERITY_ID
      secret: JIRA_SEVERITY_ID
    - name: SESSION_KEY_SECRET
      secret: SESSION_KEY_SECRET
    - name: AUTH_COOKIE_SECRET
      secret: AUTH_COOKIE_SECRET
    - name: AUTH_ENABLED
      value: 'false'
    - name: OIDC_CLIENT_ID
      value: '0oa2sp68ck6PDehU40h8'
    - name: OIDC_WEB_REDIRECT_URI
      value: 'https://<DOMAIN>/api/auth/callback/okta'
    - name: OIDC_POST_LOGOUT_REDIRECT_URI
      value: 'https://<DOMAIN>/'
    - name: OIDC_AUTHORIZATION_ENDPOINT
      value: 'https://launchpadtest.vonage.com/oauth2/v1/authorize'
    - name: OIDC_TOKEN_ENDPOINT
      value: 'https://launchpadtest.vonage.com/oauth2/v1/token'
    - name: OIDC_INTROSPECTION_ENDPOINT
      value: 'https://launchpadtest.vonage.com/oauth2/v1/introspect'
    - name: OIDC_REVOCATION_ENDPOINT
      value: 'https://launchpadtest.vonage.com/oauth2/v1/revoke'
    - name: OIDC_END_SESSION_ENDPOINT
      value: 'https://launchpadtest.vonage.com/oauth2/v1/logout'
    # VCR does not run env.sh, so the backend defaults from env.defaults.sh are repeated here.
    - name: AUTH_SESSION_COOKIE_NAME
      value: 'oidc_session'
    - name: AUTH_ID_TOKEN_COOKIE_NAME
      value: 'oidc_id_token'
    - name: AUTH_TRANSACTION_COOKIE_NAME
      value: 'oidc_transaction'
    - name: AUTH_TRANSACTION_MAX_AGE_SECONDS
      value: '600'
    - name: AUTH_REFRESH_WINDOW_SECONDS
      value: '30'
    - name: AUTH_PROVIDER_TIMEOUT_MS
      value: '5000'
    - name: OIDC_SCOPES
      value: 'openid profile email offline_access'
    - name: AUTH_HEADER_NAME
      value: 'authorization'
    - name: AUTH_SCHEME
      value: 'Bearer'
debug:
  entrypoint: [node, bundle.cjs]
